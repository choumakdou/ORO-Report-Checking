name: Build Windows EXE

# ── Triggers ─────────────────────────────────────────────────────────────────
on:
  push:
    branches: [ main ]          # Auto-build on every push to main
  workflow_dispatch:             # Also allow manual trigger from GitHub UI

# ── Job ──────────────────────────────────────────────────────────────────────
jobs:
  build-windows:
    runs-on: windows-latest     # GitHub-hosted Windows Server runner

    steps:

      # 1. Check out the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python 3.11 (64-bit)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      # 3. Install all Python dependencies + PyInstaller
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # 4. Run PyInstaller
      - name: Build EXE with PyInstaller
        run: |
          pyinstaller `
            --name ORO_QC_Checker `
            --onedir `
            --windowed `
            --collect-all customtkinter `
            --collect-all fitz `
            --collect-all reportlab `
            --hidden-import openai `
            --hidden-import requests `
            --hidden-import PIL._tkinter_finder `
            main.py

      # 5. Create a sample config.json placeholder (without real API key)
      - name: Add config.json placeholder
        run: |
          echo '{"api_key": "", "model": "gpt-4o-mini"}' > dist\ORO_QC_Checker\config.json

      # 6. Upload the built folder as a downloadable artifact
      #    Available for 30 days from the Actions run page
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ORO_QC_Checker_Windows_v2
          path: dist\ORO_QC_Checker\
          retention-days: 30
